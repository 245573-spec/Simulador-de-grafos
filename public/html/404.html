<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/Simulador-de-grafos/css/404.css">
    <title>Graphormática</title>

    <script type="text/javascript">
      var isGithub = window.location.hostname.indexOf('github.io') !== -1;
      var pathSegmentsToKeep = isGithub ? 1 : 0;
      var l = window.location;

      if (l.search.indexOf('?/') === -1) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
</head>
<body>
  <div class="not-found-container">
    <div class="not-found-card">
      <div class="graph-logo-wrapper">
        <svg viewBox="0 0 300 300" class="graph-svg" xmlns="http://www.w3.org/2000/svg">
          <!-- Aristas del Pentágono exterior -->
          <g class="edges-outer">
            <line x1="150" y1="30" x2="260" y2="105" class="edge e1" />
            <line x1="260" y1="105" x2="220" y2="230" class="edge e2" />
            <line x1="220" y1="230" x2="80" y2="230" class="edge e3" />
            <line x1="80" y1="230" x2="40" y2="105" class="edge e4" />
            <line x1="40" y1="105" x2="150" y2="30" class="edge e5" />
          </g>

          <!-- Aristas interiores -->
          <g class="edges-inner">
            <line x1="120" y1="100" x2="80" y2="125" class="edge e6" />
            <line x1="80" y1="125" x2="105" y2="165" class="edge e7" />
            <line x1="200" y1="100" x2="175" y2="125" class="edge e8" />
          </g>

          <!-- Nodos Exteriores -->
          <g class="nodes-outer">
            <circle cx="150" cy="30" r="10" class="node n1" />
            <circle cx="260" cy="105" r="10" class="node n2" />
            <circle cx="220" cy="230" r="10" class="node n3" />
            <circle cx="80" cy="230" r="10" class="node n4" />
            <circle cx="40" cy="105" r="10" class="node n5" />
          </g>

          <!-- Nodos Interiores -->
          <g class="nodes-inner">
            <circle cx="120" cy="100" r="7" class="node n6" />
            <circle cx="80" cy="125" r="7" class="node n7" />
            <circle cx="105" cy="165" r="7" class="node n8" />
          </g>
        </svg>
      </div>

      <div class="error-code">404</div>
      <h2>Camino no encontrado</h2>
      <p>El algoritmo de recorrido no pudo hallar la ruta solicitada.</p>

      <a href="/Simulador-de-grafos/" class="btn-home">Volver al Inicio</a>
    </div>
  </div>
</body>
</html>
